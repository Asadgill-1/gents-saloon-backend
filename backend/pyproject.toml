[project]
name = "gents-saloon-backend"
version = "0.1.0"
description = "Gents Saloon multi-tenant SaaS backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery==5.6.3",
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pyjwt[crypto]==2.13.0",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "supabase==2.31.0",
  "uvicorn[standard]==0.51.0",
  "aiogram==3.30.0",
  "cryptography==49.0.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]
