name: gents-saloon-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gents_saloon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gents_saloon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "local-dev-password"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-dev-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dev-data:
  redis-dev-data:
